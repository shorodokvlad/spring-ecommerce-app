# Render Blueprint — deploys the Spring Boot backend from the Dockerfile.
# In Render: New + -> Blueprint -> select this repo. Secret values are
# prompted in the dashboard (sync: false), never stored here.
services:
  - type: web
    name: spring-ecommerce-backend
    runtime: docker
    plan: free
    # Sit next to the Supabase database (eu-central-1 / Frankfurt) so DB
    # queries don't cross the Atlantic on every request
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "2424"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75"
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # SHV Assistant (AI service from the RAG repo). Same token on both services.
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TOKEN
        sync: false
