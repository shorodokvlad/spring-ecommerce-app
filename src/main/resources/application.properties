spring.application.name=Ecommerce
server.port=2424

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase free-tier session pooler allows 15 client connections total.
# Keep each running instance small so local + deployed stay under the cap.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update

secreteJwtString=${JWT_SECRET}

aws.s3.access=${AWS_S3_ACCESS_KEY}
aws.s3.secrete=${AWS_S3_SECRET_KEY}

# Resend Email Configuration (https://resend.com)
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# Used to build password-reset and email verification links sent by email
app.frontend-url=${FRONTEND_URL:https://ecommerce.shorodokvlad.eu}


# Google Sign-In (OAuth client ID from Google Cloud Console)
app.google.client-id=${GOOGLE_CLIENT_ID:647751861146-ujt60ari506ptp23hcc04kans0n8kmif.apps.googleusercontent.com}

# Multipart upload limits (Default in Spring Boot is 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB