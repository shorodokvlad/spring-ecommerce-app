spring.application.name=Ecommerce
server.port=2424

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase free-tier session pooler allows 15 client connections total.
# Keep each running instance small so local + deployed stay under the cap.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

secreteJwtString=${JWT_SECRET}

# Cloudflare R2 object storage
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY_ID}
r2.secret-key=${R2_SECRET_ACCESS_KEY}
r2.bucket=${R2_BUCKET:shv-ecommerce}
r2.public-url=${R2_PUBLIC_URL}

# Resend Email Configuration (https://resend.com)
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:onboarding@resend.dev}

# Used to build password-reset and email verification links sent by email
app.frontend-url=${FRONTEND_URL:https://ecommerce.shorodokvlad.eu}


# Google Sign-In (OAuth client ID from Google Cloud Console)
app.google.client-id=${GOOGLE_CLIENT_ID:647751861146-ujt60ari506ptp23hcc04kans0n8kmif.apps.googleusercontent.com}

# SHV Assistant (Python AI service). The token guards /internal/ai/** and is sent
# to the AI service; leave it unset to keep the internal endpoints closed.
ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service-token=${AI_SERVICE_TOKEN:}
# Streamed chat answers (several tool calls on a free LLM) can take longer than the
# servlet container's default async timeout of 30 s.
spring.mvc.async.request-timeout=150s

# Multipart upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=250MB

# Delivery estimate engine (business days added on top of per-zone transit days)
shipping.processing-days=${SHIPPING_PROCESSING_DAYS:2}

# No Spring Data Redis repositories are used; only the cache. Silences the
# "Multiple Spring Data modules found / Could not safely identify store
# assignment" startup noise.
spring.data.redis.repositories.enabled=false

# Disable heavy database schema generation/validation on startup
spring.jpa.hibernate.ddl-auto=none

# Disable unnecessary background scanning
spring.data.jpa.repositories.bootstrap-mode=lazy

# Speed up Tomcat by skipping scanning of standard jars
server.tomcat.additional-tld-skip-jars=*.jar